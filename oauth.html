<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OAuth Redirect</title>
</head>
<body>
    <script>
        // Plaid's required script to handle the return from OAuth
        const handler = window.opener.plaidLinkHandler;
        if (handler) {
            handler.resumeOAuth();
        } else {
            console.error("Link handler not found");
        }
    </script>
</body>
</html>
